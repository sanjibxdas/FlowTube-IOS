name: iOS build (.ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: Static audit (iOS 12 API rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Swift sources
        run: python3 scripts/audit.py

  build:
    name: Build unsigned .ipa
    needs: audit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select an Xcode that still supports iOS 12
        run: |
          for v in 15.4 15.2 15.0.1 14.3.1 14.2; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              echo "Using Xcode $v"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          # XcodeGen 2.46 writes the Xcode 16 project format (objectVersion 77).
          # Xcode 15.4 is the last Xcode that can target iOS 12, so downgrade the format.
          PBX=Flow.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' "$PBX"
          sed -i '' '/preferredProjectObjectVersion/d' "$PBX"
          grep -m1 objectVersion "$PBX"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Flow.xcodeproj \
            -scheme Flow \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log || { echo '--- build failed ---'; tail -n 400 build.log; exit 1; }

      - name: Package and fakesign .ipa
        run: |
          APP="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          echo "Found app: $APP"
          rm -rf Payload Flow.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "Payload/$(basename "$APP")/Info.plist"

          # An unsigned app has no code signature, so iOS sees no application-identifier
          # entitlement and Filza/installd rejects the install. Ad-hoc signing with the
          # entitlements below produces exactly what AppSync Unified and Sideloadly expect:
          # a fakesigned bundle that still gets re-signed with the user's own certificate
          # by any sideloading tool.
          cat > entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>FLOWTEAM01.org.flowtube.Flow</string>
            <key>com.apple.developer.team-identifier</key>
            <string>FLOWTEAM01</string>
            <key>keychain-access-groups</key>
            <array>
              <string>FLOWTEAM01.org.flowtube.Flow</string>
            </array>
            <key>get-task-allow</key>
            <true/>
            <key>com.apple.security.application-groups</key>
            <array>
              <string>group.org.flowtube.Flow</string>
            </array>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - --entitlements entitlements.plist "Payload/$(basename "$APP")"
          echo '--- signature ---'
          codesign -dv "Payload/$(basename "$APP")" 2>&1 | head -8
          echo '--- embedded entitlements ---'
          codesign -d --entitlements :- "Payload/$(basename "$APP")" 2>/dev/null | head -20

          zip -qry Flow.ipa Payload
          ls -lh Flow.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Flow-ipa
          path: Flow.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
